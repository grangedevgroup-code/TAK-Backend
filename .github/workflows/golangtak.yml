name: GolangTAK

on:
  push:
    branches: [main]
    paths:
      - "GolangTAK/**"
      - ".github/workflows/golangtak*.yml"
  pull_request:
    paths:
      - "GolangTAK/**"
      - ".github/workflows/golangtak*.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: GolangTAK

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: GolangTAK/go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Cross-compile every release target
        if: runner.os == 'Linux'
        run: sh scripts/build.sh ci

  install:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=ci" -o "golangtak$ext" ./cmd/golangtak

      - name: Install (Linux and macOS)
        if: runner.os != 'Windows'
        run: GOLANGTAK_BINARY="$PWD/golangtak" sh scripts/install.sh

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOLANGTAK_BINARY = Join-Path $PWD 'golangtak.exe'
          ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Use the installed server (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          set -e
          sudo golangtak status
          sudo golangtak selftest
          sudo golangtak user add alice --groups Blue --callsign ALPHA-1
          sudo golangtak user list
          sudo golangtak qr alice > /dev/null
          sudo golangtak user package alice --out-file /tmp/alice.zip
          test -s /tmp/alice.zip
          sudo golangtak config set ports.websocket 8091
          sleep 3
          sudo golangtak selftest
          sudo golangtak backup /tmp/backup.zip
          test -s /tmp/backup.zip

      - name: Use the installed server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $g = 'C:\Program Files\GolangTAK\golangtak.exe'
          & $g status; if ($LASTEXITCODE) { exit 1 }
          & $g selftest; if ($LASTEXITCODE) { exit 1 }
          & $g user add alice --groups Blue --callsign ALPHA-1; if ($LASTEXITCODE) { exit 1 }
          & $g user package alice --out-file "$env:RUNNER_TEMP\alice.zip"; if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\alice.zip")) { exit 1 }
          & $g config set ports.websocket 8091; if ($LASTEXITCODE) { exit 1 }
          Start-Sleep -Seconds 3
          & $g selftest; if ($LASTEXITCODE) { exit 1 }

      - name: Recover after a crash (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          sudo pkill -9 -x golangtak
          for _ in $(seq 1 30); do
            sleep 2
            if sudo golangtak selftest; then exit 0; fi
          done
          sudo golangtak logs -n 50 || true
          exit 1

      - name: Recover after a crash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $g = 'C:\Program Files\GolangTAK\golangtak.exe'
          Stop-Process -Name golangtak -Force
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            & $g selftest
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          & $g logs -n 50
          exit 1

      - name: Restart the service
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "/c/Program Files/GolangTAK/golangtak.exe" restart
            "/c/Program Files/GolangTAK/golangtak.exe" selftest
          else
            sudo golangtak restart
            sudo golangtak selftest
          fi

      - name: Uninstall
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "/c/Program Files/GolangTAK/golangtak.exe" uninstall --purge
            sleep 6
            test ! -e "/c/Program Files/GolangTAK/golangtak.exe"
            test ! -e "/c/ProgramData/GolangTAK"
          else
            sudo golangtak uninstall --purge
            test ! -e /usr/local/bin/golangtak
          fi
