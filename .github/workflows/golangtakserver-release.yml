name: GolangTAKServer release

on:
  push:
    tags:
      - "golangtakserver-v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: GolangTAKServer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.2"
          check-latest: true
          cache: false
      - name: Test
        run: go test -count=1 ./...
      - name: Build release binaries
        run: sh scripts/build.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#golangtakserver-v}"
          cat > notes.md <<EOF
          GolangTAKServer $version

          Install or upgrade on Linux, Raspberry Pi, macOS and BSD:

              curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/GolangTAKServer/scripts/install.sh | sh

          Install or upgrade on Windows (PowerShell):

              irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/GolangTAKServer/scripts/install.ps1 | iex

          Or download the binary for your system below, check it against SHA256SUMS, and run "golangtakserver install".

          GolangTAKServer is an independent open source project and is not affiliated with tak.gov or the TAK Product Center.
          EOF
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "GolangTAKServer $version" --notes-file notes.md
          fi

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#golangtakserver-v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/golangtakserver"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: GolangTAKServer
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=GolangTAKServer, open source server for TAK clients
            org.opencontainers.image.licenses=Apache-2.0
          push: true
