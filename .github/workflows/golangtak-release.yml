name: GolangTAK release

on:
  push:
    tags:
      - "golangtak-v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: GolangTAK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          check-latest: true
          cache: false
      - name: Test
        run: go test -count=1 ./...
      - name: Build release binaries
        run: sh scripts/build.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#golangtak-v}"
          cat > notes.md <<EOF
          GolangTAK $version

          Install or upgrade on Linux, Raspberry Pi, macOS and BSD:

              curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/GolangTAK/scripts/install.sh | sh

          Install or upgrade on Windows (PowerShell):

              irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/GolangTAK/scripts/install.ps1 | iex

          Or download the binary for your system below, check it against SHA256SUMS, and run "golangtak install".

          GolangTAK is an independent open source project and is not affiliated with tak.gov or the TAK Product Center.
          EOF
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "GolangTAK $version" --notes-file notes.md
          fi
